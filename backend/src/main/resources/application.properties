spring.application.name=uspace

# ==================== 服务端口 ====================
server.port=8080

# ==================== 数据源（MySQL）====================
# 前置条件：先建库
#   CREATE DATABASE uspace DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
#
# 账号密码通过环境变量注入，避免把凭据写进仓库。
# 未设置环境变量时回退为 root / 空密码。
spring.datasource.url=jdbc:mysql://localhost:3306/uspace?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== 门锁模块 ====================
# 实现方式：mock=模拟实现（不访问外网，默认）；ttlock=真实通通锁云（待实现）
uspace.lock.provider=mock

# --- 以下为模拟实现的可调参数，provider=mock 时生效 ---

# 模拟网络调用失败概率 0~1。默认 0 表示从不失败；
# 演示异常处理分支时可调大，例如 0.3 表示三成概率失败
uspace.lock.mock.failure-rate=0

# 模拟单次调用的网络延迟（毫秒），调大可观察异步与超时处理
uspace.lock.mock.latency-millis=0

# 模拟的锁是否支持远程下发。置为 false 可模拟「纯蓝牙锁」，
# 此时 addType=2 的远程下发会被拒绝（对应真实场景中未接网关的锁）
uspace.lock.mock.remote-supported=true

# ==================== 计费模块 ====================
# 计费公式：段费用 = ceil((段时长分钟 − 宽限) ÷ 单位时长) × 单价，再与时段封顶取小
# 总费用 = 各时段段费用之和（跨时段分别计算、分别封顶）
# 金额一律用十进制字符串写，不要写成 4.0 这类浮点形式
#
# 封顶 = 10 档 × 对应单价 = 5 小时价格。单价与封顶是绑定的，调价时四个数字要一起改。

uspace.billing.unit-minutes=30

# 日夜场差异化单价：日场 4 元/30 分（8 元/时），夜场 3.5 元/30 分（7 元/时）。
# 夜场更便宜 —— 夜间是共享空间闲置率最高的时段，用价格换利用率
uspace.billing.day-unit-price=4
uspace.billing.night-unit-price=3.5

# 结账误差宽限：既让整点恰好为单价 × 2，也隐含「首 5 分钟内免费出场」。
# 取 5 分钟是因为一局舞萌的下限约 6 分钟（最低 3 首 × 每首约 2 分钟）；
# 而算上投币、选曲、进出场开销后，完整打完一局必然超过 5 分钟、会正常计费 ——
# 这 5 分钟只覆盖「没打成一局」的场景，连最短的一局都覆盖不到，不存在套利空间。
# 改这个数会连带改变档位边界、免费时长与「达到封顶所需时长」（现为 4 小时 36 分）
uspace.billing.grace-minutes=5

uspace.billing.day-cap=40
uspace.billing.night-cap=35
uspace.billing.day-start=10:00
uspace.billing.day-end=22:00

# --- 月度累计消费优惠 ---
# 当月【已支付】订单的实付额之和达到门槛后，当月后续订单整单按优惠价计费。
# 判定在订单粒度：不逐档、不追溯已结算的订单；本单自身不计入累计。
# 优惠是整列降价，封顶同样降到「10 档 × 优惠单价」
uspace.billing.monthly-discount.enabled=true
uspace.billing.monthly-discount.threshold=200
uspace.billing.monthly-discount.day-unit-price=3.5
uspace.billing.monthly-discount.night-unit-price=3
uspace.billing.monthly-discount.day-cap=35
uspace.billing.monthly-discount.night-cap=30

# ==================== 订单模块（模块 8）====================
# 下发的限时门锁密码有效期。这个值只是【兜底】—— 密码在用户点「开门」时随订单一起下发，
# 他立刻就会走到门口用掉；它真正要覆盖的是「玩到一半出门买水、吃饭再回来」。
# 取 12 小时是因为恰好覆盖一个完整夜场（22:00–10:00），也覆盖白天从下午玩到深夜。
#
# 过期后用户点「查看密码」会自动续期，且【不换密码】—— 调通通锁的 changePasscode
# 改有效期窗口，密码数字不变（用户截图转发出去的那串始终有效），锁上也不累积密码。
#
# 演示用：改成 20s，一分钟内就能稳定复现「过期 → 续期」与「续期失败 → 重新下发」
# 两条分支，不必真等 12 小时。必须带单位后缀（12h / 30m），不带后缀时 Spring 按毫秒解析。
uspace.order.passcode-valid-duration=12h

# 包场开始前多久停止接待新顾客。默认 15 分钟。
# 一局游戏打不完就要被清场，放进来等于让顾客花了钱却玩不尽兴 ——
# 15 分钟刚好覆盖「进来打一局」的最短耗时，更晚进来的必然会被打断。
# 对店内散客无影响（准入只挡新订单），他们玩到包场开始，由清场调度结算离场。
uspace.order.booking-lead-duration=15m

# 包场参与者（包场人与被邀请者）可以提前多久入场。默认 5 分钟。
# 比普通顾客多的这点提前量，用来进店放东西、做开场准备。
# 必须不大于上面的 booking-lead-duration：反过来的话会形成一个
# 「参与者能进、非参与者也能进」的窗口，提前量就失去意义了。
uspace.order.participant-lead-duration=5m

# 包场清场调度：包场开始时把仍在店内的非参与者订单结算掉（模块 8）。
# 关掉不影响准入 —— 散客只是不会被自动清场，仍可自行点「结束使用」。
uspace.order.clear-scheduler.enabled=true

# 扫描间隔（毫秒）。默认 60000 = 1 分钟。
# 演示时改成 5000，包场开始后几秒内就能看到清场效果，不必等一分钟。
# 注意单位是毫秒：@Scheduled 的 fixedDelayString 只认纯数字或 ISO-8601（PT1M），
# 写成 "60s" 会在启动时报错。
uspace.order.clear-scheduler.interval-millis=60000

# ==================== 支付模块（模块 8）====================
# 实现方式：mock=模拟实现（不访问外网，默认）；real=真实支付平台（待实现）
# 开关只有两档，不像门锁那样按通道各配一个 —— 通道是运行时按用户浏览器环境
# 决定的（微信内 JSAPI / 微信外 H5 / 支付宝 WAP），不是部署时的配置项。
uspace.payment.provider=mock

# --- 以下为模拟实现的可调参数，provider=mock 时生效 ---

# 模拟网关调用失败概率 0~1。默认 0 表示从不失败；
# 演示异常分支时调到 0.3，发起支付会返回 502 PAYMENT_GATEWAY_UNAVAILABLE
uspace.payment.mock.failure-rate=0

# 模拟回调投递丢失概率 0~1。默认 0 表示必达。
# 设为 1 可稳定复现「钱付了、回调没到」—— 这是生产环境的必然事件
# （网络抖动、平台重试耗尽、服务重启窗口），也正是本模块必须提供
# 「主动查单」补偿路径的理由。设为 1 后支付成功但订单仍停在待支付，点一下查单就补上。
uspace.payment.mock.notify-drop-rate=0

# 模拟单次调用的网络延迟（毫秒），调大可观察前端加载态
uspace.payment.mock.latency-millis=0

# 模拟支付接口的路径，作为 mockPayUrl 返回给前端。
# 它指向 API 而不是页面 —— 前端拿到非空的 mockPayUrl 就知道处于模拟模式，
# 弹出自己的模拟收银台去调它。这样不必为演示开匿名路径，模拟支付同样要
# 带 JWT 并校验支付单归属。
uspace.payment.mock.pay-path=/api/payments/mock/pay

# ==================== 优惠管理（模块 9）====================
# 两张月卡：全天 600 / 夜间 320。按购买日起 30 天计（含首尾），不按自然月 ——
# 否则月末几天买卡的用户只买到两三天，同样的钱买到的东西差一大截。
#
# 「哪些时段免费」【不是】配置项：全天卡覆盖全部段、夜间卡只覆盖夜场段，
# 夜场边界沿用上面的 uspace.billing.day-start / day-end，不另设一套 ——
# 改计费时段会同时改变月卡权益，这是刻意的单一事实来源。
# 价格与天数是运营参数，所以放这里。
uspace.promotion.monthly-card.enabled=true
uspace.promotion.monthly-card.valid-days=30
uspace.promotion.monthly-card.all-day-price=600
uspace.promotion.monthly-card.night-price=320

# 待支付购买单的存活时长。超时后下次购卡时自动置为已关闭（用户无感）；
# 未超时则拒绝重复购买（40925），前端引导回到收银台或调取消接口。
# 演示用：改成 1m，一分钟内就能复现「超时后可再次购买」这条分支。
# 生产环境要按最短的支付通道寿命对齐 —— JSAPI 凭据 2 小时、H5 链接只有 5 分钟。
uspace.promotion.monthly-card.pending-timeout=30m

# 到期翻转：把失效日已过的生效中卡置为已过期。
# 它【不影响谁能免单】—— 免单判定同时校验状态与有效期，日期条件保证了「到点就停」，
# 所以这个任务被关掉也不会出现「过期卡还在免单」。它只是让列表上的状态
# 显示得准一点（运营后台筛选、模块 10 统计口径）。
uspace.promotion.expiry-scheduler.enabled=true
uspace.promotion.expiry-scheduler.interval-millis=3600000


# ==================== 认证模块（模块 2）====================
# JWT 有效期（天）。共享空间用户可能间隔数周才再次到店，有效期过短会让人反复登录；
# 有 token_version 兜底（封禁 / 改密即刻失效），较长有效期不影响安全
uspace.auth.expire-days=7

# 签发者标识，写进载荷的 iss 声明，验签时一并校验
uspace.auth.issuer=uspace

# ⚠️ 签名密钥的【值】不写在此处，从环境变量 JWT_SECRET 注入（与 MYSQL_PASSWORD 同一处理方式）。
#    下面这一行只是建立映射：Spring 不会自动把名为 JWT_SECRET 的环境变量
#    绑到 uspace.auth.secret 上（它认的是 USPACE_AUTH_SECRET），所以要显式指过去。
#    冒号后为空表示「没设置时留空」，届时 JwtService 会在启动阶段直接报错 ——
#    宁可起不来，也不能用一个空密钥签名，那等于没有签名。
#    要求至少 32 字节（HS256 的密钥强度下限），不足同样拒绝启动。
#    本机设置方式（Windows 下环境变量只对新进程生效，设完需重开终端）：
#      [Environment]::SetEnvironmentVariable('JWT_SECRET', '你的密钥', 'User')
uspace.auth.secret=${JWT_SECRET:}

# 关掉 Spring Security 的默认用户自动配置。
# 不关的话，应用启动时会创建一个内存用户并在日志里打印随机密码 ——
# 那个用户在本系统里毫无用处（formLogin 与 httpBasic 都已关闭，根本登不进去），
# 但日志里那行「Using generated security password」会让人以为配置漏了什么。
# 本系统的认证完全由 JwtAuthenticationFilter 承担。
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ==================== MyBatis-Plus ====================
# 打印 SQL 日志，开发期便于调试；上线前应关闭
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 主键策略：库表用的是 AUTO_INCREMENT，让 ID 走数据库自增，
# 而不是 MyBatis-Plus 默认的雪花算法（那会生成 19 位长整型，可读性差）
mybatis-plus.global-config.db-config.id-type=auto

# 逻辑删除：deleted=1 视为已删。配在全局而非每个实体的字段注解上，
# 将来新增实体不必逐个记得加注解（biz_access_record 表无此列，不受影响）
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

spring.application.name=uspace

# ==================== 服务端口 ====================
server.port=8080

# ==================== 数据源（MySQL）====================
# 前置条件：先建库
#   CREATE DATABASE uspace DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
#
# 账号密码通过环境变量注入，避免把凭据写进仓库。
# 未设置环境变量时回退为 root / 空密码。
spring.datasource.url=jdbc:mysql://localhost:3306/uspace?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== 门锁模块 ====================
# 实现方式：mock=模拟实现（不访问外网，默认）；ttlock=真实通通锁云（待实现）
uspace.lock.provider=mock

# --- 以下为模拟实现的可调参数，provider=mock 时生效 ---

# 模拟网络调用失败概率 0~1。默认 0 表示从不失败；
# 演示异常处理分支时可调大，例如 0.3 表示三成概率失败
uspace.lock.mock.failure-rate=0

# 模拟单次调用的网络延迟（毫秒），调大可观察异步与超时处理
uspace.lock.mock.latency-millis=0

# 模拟的锁是否支持远程下发。置为 false 可模拟「纯蓝牙锁」，
# 此时 addType=2 的远程下发会被拒绝（对应真实场景中未接网关的锁）
uspace.lock.mock.remote-supported=true

# ==================== 计费模块 ====================
# 计费公式：段费用 = ceil((段时长分钟 − 宽限) ÷ 单位时长) × 单价，再与时段封顶取小
# 总费用 = 各时段段费用之和（跨时段分别计算、分别封顶）
# 金额一律用十进制字符串写，不要写成 4.0 这类浮点形式
#
# 封顶 = 10 档 × 对应单价 = 5 小时价格。单价与封顶是绑定的，调价时四个数字要一起改。

uspace.billing.unit-minutes=30

# 日夜场差异化单价：日场 4 元/30 分（8 元/时），夜场 3.5 元/30 分（7 元/时）。
# 夜场更便宜 —— 夜间是共享空间闲置率最高的时段，用价格换利用率
uspace.billing.day-unit-price=4
uspace.billing.night-unit-price=3.5

# 结账误差宽限：既让整点恰好为单价 × 2，也隐含「首 5 分钟内免费出场」。
# 取 5 分钟是因为一局舞萌的下限约 6 分钟（最低 3 首 × 每首约 2 分钟）；
# 而算上投币、选曲、进出场开销后，完整打完一局必然超过 5 分钟、会正常计费 ——
# 这 5 分钟只覆盖「没打成一局」的场景，连最短的一局都覆盖不到，不存在套利空间。
# 改这个数会连带改变档位边界、免费时长与「达到封顶所需时长」（现为 4 小时 36 分）
uspace.billing.grace-minutes=5

uspace.billing.day-cap=40
uspace.billing.night-cap=35
uspace.billing.day-start=10:00
uspace.billing.day-end=22:00

# --- 月度累计消费优惠 ---
# 当月【已支付】订单的实付额之和达到门槛后，当月后续订单整单按优惠价计费。
# 判定在订单粒度：不逐档、不追溯已结算的订单；本单自身不计入累计。
# 优惠是整列降价，封顶同样降到「10 档 × 优惠单价」
uspace.billing.monthly-discount.enabled=true
uspace.billing.monthly-discount.threshold=200
uspace.billing.monthly-discount.day-unit-price=3.5
uspace.billing.monthly-discount.night-unit-price=3
uspace.billing.monthly-discount.day-cap=35
uspace.billing.monthly-discount.night-cap=30

# ==================== 订单模块（模块 8）====================
# 下发的限时门锁密码有效期。这个值只是【兜底】—— 密码在用户点「开门」时随订单一起下发，
# 他立刻就会走到门口用掉；它真正要覆盖的是「玩到一半出门买水、吃饭再回来」。
# 取 12 小时是因为恰好覆盖一个完整夜场（22:00–10:00），也覆盖白天从下午玩到深夜。
#
# 过期后用户点「查看密码」会自动续期，且【不换密码】—— 调通通锁的 changePasscode
# 改有效期窗口，密码数字不变（用户截图转发出去的那串始终有效），锁上也不累积密码。
#
# 演示用：改成 20s，一分钟内就能稳定复现「过期 → 续期」与「续期失败 → 重新下发」
# 两条分支，不必真等 12 小时。必须带单位后缀（12h / 30m），不带后缀时 Spring 按毫秒解析。
uspace.order.passcode-valid-duration=12h

# 包场开始前多久停止接待新顾客。默认 15 分钟。
# 一局游戏打不完就要被清场，放进来等于让顾客花了钱却玩不尽兴 ——
# 15 分钟刚好覆盖「进来打一局」的最短耗时，更晚进来的必然会被打断。
# 对店内散客无影响（准入只挡新订单），他们玩到包场开始，由清场调度结算离场。
uspace.order.booking-lead-duration=15m

# 包场参与者（包场人与被邀请者）可以提前多久入场。默认 5 分钟。
# 比普通顾客多的这点提前量，用来进店放东西、做开场准备。
# 必须不大于上面的 booking-lead-duration：反过来的话会形成一个
# 「参与者能进、非参与者也能进」的窗口，提前量就失去意义了。
uspace.order.participant-lead-duration=5m

# 包场结束前多久，开始在计时卡片上提示「之后按时长计费」。默认 15 分钟。
# 包场期间不计费，所以平时不该显示「进入下一档 ¥X」；
# 但包场一结束就重新按分钟计费，打算继续玩的人得提前知道。
uspace.order.booking-end-warning=15m

# 包场清场调度：包场开始时把仍在店内的非参与者订单结算掉（模块 8）。
# 关掉不影响准入 —— 散客只是不会被自动清场，仍可自行点「结束使用」。
uspace.order.clear-scheduler.enabled=true

# 扫描间隔（毫秒）。默认 60000 = 1 分钟。
# 演示时改成 5000，包场开始后几秒内就能看到清场效果，不必等一分钟。
# 注意单位是毫秒：@Scheduled 的 fixedDelayString 只认纯数字或 ISO-8601（PT1M），
# 写成 "60s" 会在启动时报错。
uspace.order.clear-scheduler.interval-millis=60000

# ==================== 支付模块（模块 8）====================
# 【两个开关，各管一件事，不可互相替代】
#
# provider —— 代码能不能对外调用支付平台，决定容器里装配哪个 PaymentGateway：
#   mock      模拟实现，不访问外网（本机开发与答辩演示用这一档）
#   disabled  没有线上支付，装配一个所有调用都明确失败的实现（12 月投产用这一档）
#   real      真实支付平台（待实现；个人主体办不了商户号，见设计文档第九章）
#   ⚠️ 三档都必须能装配出 bean —— PaymentService 的构造器依赖 PaymentGateway，
#      而各实现都挂在 @ConditionalOnProperty 上。配成这几个值之外的东西会让
#      容器装配失败、应用直接起不来，而不是「优雅地关掉支付」
#
# enabled-channels —— 本店当前收哪几种钱，取值逗号分隔（业务事实，不是技术开关）：
#   QR_UPLOAD     扫码转账（店内收款码 + 用户传付款截图 + 管理员复核）
#   WXPAY_JSAPI   微信内浏览器
#   WXPAY_H5      微信外手机浏览器
#   ALIPAY_WAP    支付宝手机网站支付
#   收银台的选项由它决定（GET /api/payments/channels），前端不写死。
#   拼错的通道名会被忽略并在启动时 WARN —— 不因此让服务起不来。
#
# 【12 月投产怎么改】把下面两行换成：
#   uspace.payment.provider=disabled
#   uspace.payment.enabled-channels=QR_UPLOAD
uspace.payment.provider=mock
uspace.payment.enabled-channels=QR_UPLOAD,WXPAY_JSAPI,WXPAY_H5,ALIPAY_WAP

# --- 以下为模拟实现的可调参数，provider=mock 时生效 ---

# 模拟网关调用失败概率 0~1。默认 0 表示从不失败；
# 演示异常分支时调到 0.3，发起支付会返回 502 PAYMENT_GATEWAY_UNAVAILABLE
uspace.payment.mock.failure-rate=0

# 模拟回调投递丢失概率 0~1。默认 0 表示必达。
# 设为 1 可稳定复现「钱付了、回调没到」—— 这是生产环境的必然事件
# （网络抖动、平台重试耗尽、服务重启窗口），也正是本模块必须提供
# 「主动查单」补偿路径的理由。设为 1 后支付成功但订单仍停在待支付，点一下查单就补上。
uspace.payment.mock.notify-drop-rate=0

# 模拟单次调用的网络延迟（毫秒），调大可观察前端加载态
uspace.payment.mock.latency-millis=0

# 模拟支付接口的路径，作为 mockPayUrl 返回给前端。
# 它指向 API 而不是页面 —— 前端拿到非空的 mockPayUrl 就知道处于模拟模式，
# 弹出自己的模拟收银台去调它。这样不必为演示开匿名路径，模拟支付同样要
# 带 JWT 并校验支付单归属。
uspace.payment.mock.pay-path=/api/payments/mock/pay

# ==================== 文字识别（模块 8 的支付能力）====================
# 付款截图的 OCR：把截图里的金额与交易单号读出来，供用户核对、供管理员复核，
# 把人工工作量从「逐条看 100%」降到「只看对不上的那几条」。
#
# 【识别是可选的增强，不是必需】识别本身失败（网络不通、配额耗尽、凭据失效）
# 一律按「没识别出」处理，不会让用户传不了图、也不会让提交失败 ——
# 用户手填交易单号那条路一直都在，识别只是替他省一次抄写。
#
# provider —— 用哪套识别实现：
#   mock   不识别，恒返回「未识别出」（默认）。不需要任何账号，
#          整条链路照常走得通，只是后台凭证页的识别栏与流水号框都是空的
#   baidu  真实百度智能云 OCR。按真实规格接入：OAuth2 换 access_token +
#          通用文字识别（高精度版），需要填下面的凭据
#   ⚠️ 只有这两档。配成别的值会因为装配不出 OcrService 而让应用【直接起不来】，
#      这是刻意的：拼错的取值应当在启动时立刻暴露。
#      想在百度账号出问题时「关掉 OCR 但保住上传」，把 provider 改回 mock 即可。
uspace.ocr.provider=mock

# 识别超时（毫秒）。这次调用发生在用户上传截图的等待路径上 ——
# 他刚选完图正盯着进度条，所以值要给得短。超时即当作「没识别出」。
uspace.ocr.timeout-millis=3000

# --- 以下为百度智能云的凭据，provider=baidu 时必填 ---
#
# 在百度智能云控制台创建「文字识别」应用后获得。个人开发者即可注册，
# 通用文字识别（高精度版）有 1000 次/月免费额度 —— 本店一天三十来单的话
# 一个月约 900 次，刚好在额度内（超出后约 0.03 元/次，调用失败不计费）。
#
# 与 JWT_SECRET、MYSQL_PASSWORD 同一条纪律：凭据不写进这个文件（仓库是公开的），
# 走环境变量注入。未设置时取到的是空串，此时配 provider=baidu 会让应用启动失败 ——
# 同样是刻意的：「以为配了其实没配」不会报任何错，只会静默地永远识别不出，
# 而这件事没有任何人会注意到（管理员只会以为最近传的截图都不太清晰）。
uspace.ocr.baidu.api-key=${BAIDU_OCR_API_KEY:}
uspace.ocr.baidu.secret-key=${BAIDU_OCR_SECRET_KEY:}

# ==================== 对账（模块 8 的支付能力，Phase 5）====================
#
# 把收款账号导出的账单与系统里的付款凭证勾稽起来，让管理员从「逐条看 100%」
# 降到「只看差异」。账单由管理员从微信 App（xlsx）/ 支付宝 App（CSV）导出后上传，
# 管理员手工整理的「系统标准模板」CSV 也认。
#
# ⚠️ 账单留档目录【绝不能】落在 uspace.upload.dir 之下。
#    那个目录是公开可访问的（/uploads/** 在 SecurityConfig.PUBLIC_PATHS 里 ——
#    用户上传的头像与截图要用 <img src> 加载，浏览器不为图片请求带 Authorization 头）。
#    而账单里含全部交易对手、备注、金额与时间，是本店最敏感的经营数据，
#    落在那里等于挂在公网上。
#    应用启动时（ReconcileBillStorage）会校验这两个目录，重叠则【拒绝启动】——
#    与「JWT_SECRET 为空拒绝启动」同源：配置写错不会有任何报错。
#    生产环境同样建议改成应用目录之外的绝对路径。
uspace.reconcile.bill-dir=${user.dir}/reconcile-bills

# 系统侧凭证候选窗口的两端，相对【账单内容里的交易时间区间】各放宽几天。
#
# 为什么要放宽：用户提交凭证的时刻与账单上的交易时刻并不严格一致 ——
# 可能先传图后付款、可能隔天才想起来补传、时钟也可能有偏差。
# 不放宽的话这些凭证会落在窗口外，既不匹配也不产生任何差异，等于【静默漏掉】。
#
# 两端【刻意不对称】：
#   下界 1 天 —— 覆盖「先传图后付款」与时钟漂移。这种情况少见，顶多差几小时
#   上界 2 天 —— 覆盖「当天玩完忘了传、隔天才想起来」，跨一个零点再加一整天
#
# 窗口的起止会写进批次的 window_start / window_end 两列 —— 事后要答得了
# 「为什么这条凭证没被算进来」，而光看一条批次记录是推不回去的。
uspace.reconcile.window-before-days=1
uspace.reconcile.window-after-days=2

# 候选凭证数超过这个值时记一条 warn。
# 不拦、只留痕：管理员可能传了三年的账单，那时窗口宽得离谱、一次捞出上万条凭证，
# 而那种情况只会表现为「这次对账有点慢」，慢的原因没有任何线索。
uspace.reconcile.candidate-warn-threshold=5000

# ==================== 优惠管理（模块 9）====================
# 两张月卡：全天 600 / 夜间 320。按购买日起 30 天计（含首尾），不按自然月 ——
# 否则月末几天买卡的用户只买到两三天，同样的钱买到的东西差一大截。
#
# 「哪些时段免费」【不是】配置项：全天卡覆盖全部段、夜间卡只覆盖夜场段，
# 夜场边界沿用上面的 uspace.billing.day-start / day-end，不另设一套 ——
# 改计费时段会同时改变月卡权益，这是刻意的单一事实来源。
# 价格与天数是运营参数，所以放这里。
uspace.promotion.monthly-card.enabled=true
uspace.promotion.monthly-card.valid-days=30
uspace.promotion.monthly-card.all-day-price=600
uspace.promotion.monthly-card.night-price=320

# 待支付购买单的存活时长。超时后下次购卡时自动置为已关闭（用户无感）；
# 未超时则拒绝重复购买（40925），前端引导回到收银台或调取消接口。
# 演示用：改成 1m，一分钟内就能复现「超时后可再次购买」这条分支。
# 生产环境要按最短的支付通道寿命对齐 —— JSAPI 凭据 2 小时、H5 链接只有 5 分钟。
uspace.promotion.monthly-card.pending-timeout=30m

# 到期翻转：把失效日已过的生效中卡置为已过期。
# 它【不影响谁能免单】—— 免单判定同时校验状态与有效期，日期条件保证了「到点就停」，
# 所以这个任务被关掉也不会出现「过期卡还在免单」。它只是让列表上的状态
# 显示得准一点（运营后台筛选、模块 10 统计口径）。
uspace.promotion.expiry-scheduler.enabled=true
uspace.promotion.expiry-scheduler.interval-millis=3600000

# ==================== 商品（不对应论文某一章）====================
# 卖店里的实体商品（饮料、周边），是独立于时长计费之外的第二类收入。
# 收款复用模块 8 的统一支付入口（targetType = PRODUCT），与包场、月卡同一套回调。

# 待支付购买单的存活时长。默认 30 分钟。
#
# ⚠️ 它管的是【这笔单子还占不占库存】，不是【还能不能付】—— 与上面月卡的
#    pending-timeout【语义不同】，别照着月卡那条理解：
#      · 月卡超时后单子会被自动关闭、不能再付（因为「一人一卡」，
#        未关闭的旧单会把用户自己卡死，所以必须关）
#      · 商品超时后单子【仍然可以付】，只是不再计入可售量
#        （商品可以买多笔，关掉旧单反而是替用户做了「不买了」的决定）
#    因此商品这边不需要任何调度器。
#
# 软检查的公式是「可售量 = 库存 − 未超时的待支付单【件数】」。
# 这个值越小，别人越容易买到你占着的那件；越大，越容易出现
# 「有人下了单没付款、货却卖给了别人」。生产环境按最短的支付通道寿命对齐
# （JSAPI 凭据 2 小时、H5 链接只有 5 分钟），默认的 30 分钟落在两者之间。
#
# 演示用：改成 1m，一分钟内就能复现「超时单不再占库存」这条分支。
uspace.product.pending-timeout=30m


# ==================== 认证模块（模块 2）====================
# JWT 有效期（天）。共享空间用户可能间隔数周才再次到店，有效期过短会让人反复登录；
# 有 token_version 兜底（封禁 / 改密即刻失效），较长有效期不影响安全
uspace.auth.expire-days=7

# 签发者标识，写进载荷的 iss 声明，验签时一并校验
uspace.auth.issuer=uspace

# ⚠️ 签名密钥的【值】不写在此处，从环境变量 JWT_SECRET 注入（与 MYSQL_PASSWORD 同一处理方式）。
#    下面这一行只是建立映射：Spring 不会自动把名为 JWT_SECRET 的环境变量
#    绑到 uspace.auth.secret 上（它认的是 USPACE_AUTH_SECRET），所以要显式指过去。
#    冒号后为空表示「没设置时留空」，届时 JwtService 会在启动阶段直接报错 ——
#    宁可起不来，也不能用一个空密钥签名，那等于没有签名。
#    要求至少 32 字节（HS256 的密钥强度下限），不足同样拒绝启动。
#    本机设置方式（Windows 下环境变量只对新进程生效，设完需重开终端）：
#      [Environment]::SetEnvironmentVariable('JWT_SECRET', '你的密钥', 'User')
uspace.auth.secret=${JWT_SECRET:}

# 关掉 Spring Security 的默认用户自动配置。
# 不关的话，应用启动时会创建一个内存用户并在日志里打印随机密码 ——
# 那个用户在本系统里毫无用处（formLogin 与 httpBasic 都已关闭，根本登不进去），
# 但日志里那行「Using generated security password」会让人以为配置漏了什么。
# 本系统的认证完全由 JwtAuthenticationFilter 承担。
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ==================== 图片上传（模块 1）====================
# 头像与背景图（banner）的落盘目录。
#
# ⚠️ 生产环境必须改成【应用目录之外】的绝对路径，例如 /var/lib/uspace/uploads。
#    留在应用目录里的话，重新部署（覆盖整个目录、或从压缩包解压）会把用户已经
#    上传的图一并清掉，而库里那些 avatar / banner 路径还指着它们 ——
#    表现是所有用户的头像与背景图同时变成破图，且没有任何报错。
#    默认值 uploads 是相对路径，解析时相对于 JVM 的工作目录（开发期即 backend/）。
uspace.upload.dir=${user.dir}/uploads

# 对外暴露的 URL 前缀。库里的 avatar / banner 存的是 /uploads/avatar/20260930/12_a1b2.jpg
# 这样的【站内相对路径】，前端 <img :src="avatar"> 直接加载。
# 改这个值时，SecurityConfig.PUBLIC_PATHS 里那条 /uploads/** 要跟着改 ——
# 图是 <img src> 加载的，浏览器不会为图片请求带 Authorization 头。
uspace.upload.url-prefix=/uploads

# 单张图片的字节上限，默认 2MB。与下面的 multipart 限制是两道独立的闸门，都要配。
uspace.upload.max-image-bytes=2097152

# ==================== QQ 验证（模块 1）====================
# 注册时必须先证明「填的这个 QQ 号是本人的」：验证码发到 QQ 群，机器人看到后回执给后端。
# 详见 docs/开发约定与设计说明.md 的注册一节。
#
# ⚠️ 下面两个 Duration 必须带单位（m / s）—— 写 10 会被当成 10 *毫秒*，
#    验证码签发出来就已经过期，而且不会有任何报错，
#    用户只会反复看到「验证已失效，请重新获取」。项目里 passcode-valid-duration
#    已经为这条踩过一次坑。

# 验证码有效期（签发 → 在群里确认）。给得宽是因为用户要切到 QQ、找群、粘贴
uspace.user.qq-verify.code-ttl=10m

# 确认通过后的有效期。**从确认那一刻重新算**，不是沿用签发时刻 ——
# 否则第 9 分钟才确认成功的人只剩 1 分钟注册
uspace.user.qq-verify.verified-ttl=10m

# 同一个验证码最多被错猜几次，超过就整条作废
uspace.user.qq-verify.max-attempts=5

# 待验证请求数上限。签发接口匿名可用，这是防内存 DoS 的唯一兜底
uspace.user.qq-verify.max-pending=10000

# ==================== QQ 机器人（模块 11）====================
# 反向 WebSocket 接入 NapCat（OneBot v11 协议端）：NapCat 作为客户端主动连本服务。
#
# 【为什么是反向】正向是后端去连 NapCat，那样后端要自己配 NapCat 的地址、自己管重连；
# 反向则由 NapCat 负责重连（规范要求它的 reconnect_interval > 0），后端只需开一个端点。
# 收事件与发消息共用这一条连接。
#
# 本模块【以只读为主】—— 查询与播报是主体，另有两条受限写指令（/开门、/结账）。
# 它们的边界写死在三处：受 write-enabled 控制、【播报关掉时不执行】（写操作要在群里
# 留痕，看不到播报就不做）、且绝不触碰任何资金动作 —— 付款始终只在网页端发生。
# 详见 CLAUDE.md 的「QQ 机器人」一节。

# 总开关。默认关 —— 不打算用它的环境不该凭空多出一条常驻连接与一个对外端点。
#
# ⚠️ 【这里刻意保持 false，不要在配置文件里打开它】：
#    它与 access-token 必须成对出现，而令牌走环境变量（本仓库是公开的，不能写进文件）。
#    开关写死在配置文件里，就必然出现「配置说开着、令牌却没有」的时刻 ——
#    应用对此是【fail-fast 拒绝启动】的，表现是「后端莫名其妙起不来」，
#    而排查方向很容易歪到依赖、端口上去（这个坑 2026-10-04 刚踩过一次）。
#    所以开关与令牌一起放在 backend/start-backend.bat 里设（那两行紧挨着）。
#    用 IDE 启动的话，在运行配置里同样要设这两个，别只改这里。
uspace.qqbot.enabled=false

# 端点路径。⚠️ 改它要同步改 SecurityConfig.PUBLIC_PATHS 里那条字面路径 ——
# 不改的话握手会被过滤器链拦成 401，而 NapCat 那边只表现为「连不上」。
uspace.qqbot.ws-path=/onebot/v11/ws

# 访问令牌，必须与 NapCat 侧 websocketClients 配置里的 token 一致。
#
# 走环境变量注入（与 MYSQL_PASSWORD、JWT_SECRET 同一纪律）—— 本仓库是公开的。
# ⚠️ enabled=true 而这一项为空会让应用【拒绝启动】：令牌为空但端点照常注册 =
#    任何能访问本端口的人都能连上来冒充 NapCat，把在店人数与消费金额查个遍。
#    这是安全事故，不是功能故障，所以宁可起不来。
#
# 设置方式（Windows 下环境变量只对新进程生效，设完需重开终端）：
#   [Environment]::SetEnvironmentVariable('QQBOT_ACCESS_TOKEN', '你的令牌', 'User')
uspace.qqbot.access-token=${QQBOT_ACCESS_TOKEN:}

# 允许响应查询指令的群号，逗号分隔。
# 留空 = 谁都不理 —— 那是安全的默认值：填错的后果是「机器人不说话」，
# 而留空就全放开的后果是「随便拉个群都能查到本店今天赚了多少」，两种代价不对称。
# 1062204057 = 聊天房二号厅。
uspace.qqbot.allowed-groups=1062204057

# 额外接收【含金额】播报的群号（店主群），逗号分隔。
# 留空 = 所有播报都不含金额（同样是安全的那一侧）。
#
# 与 allowed-groups 是「升级」而非「并列」关系：前者里的群收到不含金额的播报，
# 这里面的群收到含金额的那版，两个列表的交集只收一条、不会重复发。
# 群消息对所有人可见，而「张三这单花了 40」是个人消费信息，所以默认不给。
# 想让店主群看到金额，把群号也加到这里。
uspace.qqbot.admin-groups=

# 播报开关（到店 / 离店推群）。
# 与上面的总开关层次不同：那个关掉是整条链路都不接（连不上、也查不了），
# 这个关掉是照常连、照常能查，只是不主动往群里推。
uspace.qqbot.broadcast.enabled=true

# 是否允许两条写指令（/开门、/结账）。代码里的默认值是 false（安全的一侧），
# 这里设成 true 是【本机的演示配置】—— 投产时想清楚再开。
#
# 三层开关各管一件事，不要互相推断：
#   · enabled=true            接入这条链路（连不上就什么都谈不上）
#   · broadcast.enabled=true  执行完在群里有播报可见
#   · write-enabled=true      允许从群里建单 / 结算
# 写指令要求【后两者都开】：播报关掉而写指令还开着的话，
# 群里会多出一次「没人看见的账」，而那正是它们被允许放进群里的前提。
uspace.qqbot.write-enabled=true

# 本人自查询的金额（/看看自己、/结账 的回复里）。
# ⚠️ 它与 admin-groups 那条「金额只进店主群」不是一个东西，各管一边：
#   · admin-groups 管【播报】—— 系统主动推给全群的消息，必须按群分级
#   · 这一项管【本人自查询】—— 自己发指令问自己的消费，触发是他主动的
# 但回复同样是群消息、全群可见，所以关掉它是连本人的金额也不显示。
uspace.qqbot.self-amount-visible=true

# 同一 QQ 的写指令冷却。防连点（每次 /开门 消耗 1 次门锁云额度）。0 = 不限制。
# ⚠️ 它不是安全防线 —— 真正的幂等来自订单模块的「上一单没结清不给开新单」。
# 商品那条路（/买个可乐）也吃这道冷却：商品单不拦「上一单没结清」，
# 所以它是那条路上唯一的防连点手段。
#
# 5 秒（2026-10-04 从 20 秒改下来）：原值 20 秒对「连着买两样东西」太长了 ——
# 前一条的回复刚发出去，第二条就被一句「操作太频繁」挡回来，而顾客只是想
# 再买一瓶水。5 秒足够挡住手抖连点两下，又不至于让人等。
uspace.qqbot.write-command-cooldown=5s

# 【为什么这里没有线程池配置】
# 播报的触发点在事务提交之后（@TransactionalEventListener(AFTER_COMMIT)），
# 那个回调跑在【用户的请求线程】上，看着像是该挪到线程池里。但没有那么做：
#   · 挪了也治不了真正的风险（NapCat 卡住不读）—— 队列满了照样阻塞调用方，
#     无界队列则会 OOM。兜住它的是 OneBotClient 里那个 sendTimeLimit：
#     到点强制关闭连接，NapCat 会按自己配的 reconnect_interval 重连
#   · 自定义 Executor bean 会命中 Spring Boot 的 @ConditionalOnMissingBean(Executor.class)，
#     【静默】变成全应用默认的 @Async 执行器 —— 将来谁写一个裸 @Async 都跑进这里的池
#   · 监听器的实际开销是「两三条索引查询 + 一次 socket 写」，局域网下是毫秒级
# 将来实测发现开门接口确实被拖慢了，再加也不迟，加的时候用私有 ExecutorService，
# 不要用 @EnableAsync。

# ==================== 站点地址（公共层）====================
# 站点对外访问地址，用来拼包场邀请链接（模块 8 取链接那一步）。
#
# ⚠️ 生产环境必须改成真实域名（且要备案、上 HTTPS），否则发出去的邀请链接
#    指向 localhost —— 别人点开只会看到自己的手机。
#    默认值取前端开发服务器的端口，方便本地把链接粘到手机上试。
#
# 注意与 uspace.upload.url-prefix 的分工：那个是【站内相对路径】的前缀，
# 存进库、由前端直接加载；本项是【对外完整地址】的前缀，是拼给人看、要能
# 粘到微信里打开的那种。换域名时只需要动这一项。
#
# 前端的更好做法是用 location.origin + path 自己拼 —— 那样拿到的是「当前这台
# 设备访问得到的地址」，开发期比后端配的任何值都准。本项是兜底与「复制链接」用。
uspace.web.base-url=http://localhost:5173

# multipart 解析层的限制。Spring 在解析请求时就会对照它，超限抛
# MaxUploadSizeExceededException（由 GlobalExceptionHandler 转成 413）。
# 不配的话 Spring 的默认值是 1MB —— 一张 1.5MB 的正常手机照片会被拒之门外，
# 而且提示语还很含糊。
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ==================== MyBatis-Plus ====================
# 打印 SQL 日志，开发期便于调试；上线前应关闭
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 主键策略：库表用的是 AUTO_INCREMENT，让 ID 走数据库自增，
# 而不是 MyBatis-Plus 默认的雪花算法（那会生成 19 位长整型，可读性差）
mybatis-plus.global-config.db-config.id-type=auto

# 逻辑删除：deleted=1 视为已删。配在全局而非每个实体的字段注解上，
# 将来新增实体不必逐个记得加注解（biz_access_record 表无此列，不受影响）
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

spring.application.name=uspace

# ==================== 服务端口 ====================
server.port=8080

# ==================== 数据源（MySQL）====================
# 前置条件：先建库
#   CREATE DATABASE uspace DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
#
# 账号密码通过环境变量注入，避免把凭据写进仓库。
# 未设置环境变量时回退为 root / 空密码。
spring.datasource.url=jdbc:mysql://localhost:3306/uspace?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== 门锁模块 ====================
# 实现方式：mock=模拟实现（不访问外网，默认）；ttlock=真实通通锁云（待实现）
uspace.lock.provider=mock

# --- 以下为模拟实现的可调参数，provider=mock 时生效 ---

# 模拟网络调用失败概率 0~1。默认 0 表示从不失败；
# 演示异常处理分支时可调大，例如 0.3 表示三成概率失败
uspace.lock.mock.failure-rate=0

# 模拟单次调用的网络延迟（毫秒），调大可观察异步与超时处理
uspace.lock.mock.latency-millis=0

# 模拟的锁是否支持远程下发。置为 false 可模拟「纯蓝牙锁」，
# 此时 addType=2 的远程下发会被拒绝（对应真实场景中未接网关的锁）
uspace.lock.mock.remote-supported=true

# ==================== 计费模块 ====================
# 计费公式：段费用 = ceil((段时长分钟 − 宽限) ÷ 单位时长) × 单价，再与时段封顶取小
# 总费用 = 各时段段费用之和（跨时段分别计算、分别封顶）
# 金额一律用十进制字符串写，不要写成 4.0 这类浮点形式

uspace.billing.unit-minutes=30
uspace.billing.unit-price=4
# 结账误差宽限：既让整点恰好 8 元/小时，也隐含「首 10 分钟内免费出场」
uspace.billing.grace-minutes=10
uspace.billing.day-cap=40
uspace.billing.night-cap=30
uspace.billing.day-start=10:00
uspace.billing.day-end=22:00

# ==================== MyBatis-Plus ====================
# 打印 SQL 日志，开发期便于调试；上线前应关闭
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
